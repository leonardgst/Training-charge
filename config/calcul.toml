# Paramètres de calcul du moteur. Chaque modification passe par une PR testée.
# Valeurs provisoires tant que le préparateur ne les a pas validées (cadrage, règle 9).

# ADR-0007 : charge de séance = moyenne des trois RPE × durée × facteur.
facteur_echelle_charge = 10

# ADR-0011 : fenêtres glissantes en jours, jour courant inclus.
fenetre_courte_jours = 7
fenetre_longue_jours = 28

# ADR-0012 : référence du z-score d'intensité, jour courant exclu.
reference_jours = 28
reference_min_jours = 21
tolerance_ecart_type_nul = 1e-9

# ADR-0014 : part minimale du poids total des indicateurs inclus qui doit être répondue.
score_poids_min = 0.5

# ADR-0015 : référence du z-score de sensations, entrée courante exclue.
sensations_reference_jours = 28
sensations_reference_min_entrees = 6
