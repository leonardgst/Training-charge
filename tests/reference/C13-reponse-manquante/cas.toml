description = "Cinq indicateurs inclus (poids 1, 1, 1, 1 et 2 pour la compréhension, total 6) et une heure de coucher hors score. Jour 1 : toutes les réponses ; jour 2 : poids répondu 4 sur 6 ; jour 3 : 3 sur 6, exactement le minimum de 50 % ; jour 4 : 2 sur 6, réponses insuffisantes ; jour 5 : 3 sur 6 avec la compréhension. Dates de calcul utiles : 2026-01-05 à 2026-01-09."
