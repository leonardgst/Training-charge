{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block titre %}{% endblock %} · Suivi de charge U19</title>
  <link rel="stylesheet" href="{% static 'suivi/vendor/pico/pico.min.css' %}">
  <link rel="stylesheet" href="{% static 'suivi/css/suivi.css' %}">
</head>
<body>
  <header class="container">
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="{% url 'accueil' %}"><strong>Suivi de charge U19</strong></a></li>
      </ul>
      {% if request.preparateur %}
      <ul>
        <li>{{ request.user.get_username }} · {{ request.preparateur.categorie.code }}</li>
        <li>
          <form method="post" action="{% url 'deconnexion' %}">
            {% csrf_token %}
            <button type="submit" class="secondary outline">Se déconnecter</button>
          </form>
        </li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
