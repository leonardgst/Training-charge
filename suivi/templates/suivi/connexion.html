<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Suivi de charge U19</title>
</head>
<body>
  <main>
    <h1>Connexion</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
